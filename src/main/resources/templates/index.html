<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Course Seat Watcher</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <h1>Course Seat Watcher</h1>

    <p class="subtitle">
        Monitor course availability and get notified when a seat opens.
    </p>

    <h2>Add Course</h2>

    <div class="error-message"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form action="/web/courses" method="post">

        <label>Course Code:</label>
        <input type="text"
               name="courseCode"
               required>

        <br><br>

        <label>Section:</label>
        <input type="text"
               name="section"
               required>

        <br><br>

        <label>Term:</label>

        <select name="term" required>

            <option value="">
                Select a term
            </option>

            <option th:each="term : ${terms}"
                    th:value="${term.key}"
                    th:text="${term.value}">
            </option>

        </select>
        <br><br>

        <label>Email:</label>
        <input type="email"
               name="email"
               placeholder="your@email.com"
               required>

        <br><br>

        <button type="submit"
                class="add-course-button">
            Submit
        </button>

    </form>


    <h2>My Courses</h2>

    <table>

        <tr>
            <th>Course</th>
            <th>Section</th>
            <th>Seats</th>
            <th>Status</th>
            <th>Watched</th>
            <th>Actions</th>
        </tr>

        <tr th:each="course : ${courses}">

            <td th:text="${course.courseCode}"></td>

            <td th:text="${course.section}"></td>

            <td th:text="${course.availableSeats}"></td>

            <td>
                <span class="status"
                      th:classappend="${course.status == 'OPEN'} ? ' open' : ' closed'"
                      th:text="${course.status}">
                </span>
            </td>

            <td th:text="${course.watched}"></td>

            <td>

                <form th:if="${!course.watched}"
                      th:action="@{/web/courses/{id}/watch(id=${course.id})}"
                      method="post">

                    <button type="submit">
                        Watch
                    </button>

                </form>

                <form th:if="${course.watched}"
                      th:action="@{/web/courses/{id}/unwatch(id=${course.id})}"
                      method="post">

                    <button type="submit">
                        Unwatch
                    </button>

                </form>

                <form th:action="@{/web/courses/{id}/delete(id=${course.id})}"
                      method="post">

                    <button type="submit">
                        Delete
                    </button>

                </form>

            </td>

        </tr>

    </table>

</div>

</body>
</html>
